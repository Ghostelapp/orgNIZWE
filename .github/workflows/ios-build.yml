name: iOS Build

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build orgNIZWE
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show default Xcode version
        run: xcodebuild -version

      - name: Validate project.pbxproj
        run: plutil -lint orgNIZWE.xcodeproj/project.pbxproj

      - name: List project targets and schemes
        run: xcodebuild -project orgNIZWE.xcodeproj -list

      - name: Build main app
        run: |
          xcodebuild \
            -project orgNIZWE.xcodeproj \
            -target orgNIZWE \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build widget extension
        run: |
          xcodebuild \
            -project orgNIZWE.xcodeproj \
            -target orgNIZWEWidgets \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run tests
        run: |
          xcodebuild \
            -project orgNIZWE.xcodeproj \
            -target orgNIZWE \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            test
        continue-on-error: true

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-build-logs
          path: |
            ~/Library/Developer/Xcode/DerivedData/**/Logs/**
            /tmp/orgnizwe-build.log
