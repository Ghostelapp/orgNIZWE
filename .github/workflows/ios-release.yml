name: iOS Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja aplikacji (np. 1.0.0)"
        required: true
        default: "1.0.0"
      build_number:
        description: "Numer buildu (np. 1)"
        required: true
        default: "1"

jobs:
  archive:
    name: Archive, Export and Upload to App Store Connect
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          echo "Sprawdzam wymagane sekrety..."
          missing=()
          [ -z "${{ secrets.APPLE_P12_BASE64 }}" ] && missing+=("APPLE_P12_BASE64")
          [ -z "${{ secrets.APPLE_P12_PASSWORD }}" ] && missing+=("APPLE_P12_PASSWORD")
          [ -z "${{ secrets.APPLE_ISSUER_ID }}" ] && missing+=("APPLE_ISSUER_ID")
          [ -z "${{ secrets.APPLE_API_KEY_ID }}" ] && missing+=("APPLE_API_KEY_ID")
          [ -z "${{ secrets.APPLE_API_PRIVATE_KEY }}" ] && missing+=("APPLE_API_PRIVATE_KEY")

          if [ ${#missing[@]} -ne 0 ]; then
            echo ""
            echo "❌ BŁĄD: Brakuje następujących sekretów w repozytorium GitHub:"
            for secret in "${missing[@]}"; do
              echo "   - $secret"
            done
            echo ""
            echo "Dodaj je w: Settings → Secrets and variables → Actions → New repository secret"
            echo "Instrukcja znajduje się w README.md w sekcji 'TestFlight — krok po kroku'."
            exit 1
          fi

          echo "✅ Wszystkie wymagane sekrety są ustawione."

      - name: Show default Xcode version
        run: xcodebuild -version

      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Install provisioning profile
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.organizer.aiorganizer
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Update version and build number
        run: |
          sed -i '' 's/MARKETING_VERSION = 1.0/MARKETING_VERSION = ${{ github.event.inputs.version }}/g' orgNIZWE.xcodeproj/project.pbxproj
          sed -i '' 's/CURRENT_PROJECT_VERSION = 1/CURRENT_PROJECT_VERSION = ${{ github.event.inputs.build_number }}/g' orgNIZWE.xcodeproj/project.pbxproj

      - name: Archive app
        run: |
          xcodebuild \
            -project orgNIZWE.xcodeproj \
            -scheme orgNIZWE \
            -destination 'generic/platform=iOS' \
            -archivePath build/orgNIZWE.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/orgNIZWE.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Save App Store Connect API key
        run: |
          mkdir -p ${{ runner.temp }}/appstoreconnect
          echo "${{ secrets.APPLE_API_PRIVATE_KEY }}" > ${{ runner.temp }}/appstoreconnect/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload IPA to App Store Connect
        run: |
          xcrun altool --upload-app \
            --type ios \
            --file build/orgNIZWE.ipa \
            --apiKey ${{ secrets.APPLE_API_KEY_ID }} \
            --apiIssuer ${{ secrets.APPLE_ISSUER_ID }} \
            --verbose
        env:
          ALTOOL_API_KEY_PATH: ${{ runner.temp }}/appstoreconnect/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: orgNIZWE-${{ github.event.inputs.version }}.ipa
          path: build/orgNIZWE.ipa
