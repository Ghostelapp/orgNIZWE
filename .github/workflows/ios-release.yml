name: iOS Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja aplikacji (np. 1.0.0)"
        required: true
        default: "1.0.0"

jobs:
  archive:
    name: Archive and Export IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show default Xcode version
        run: xcodebuild -version

      - name: Install Apple certificate
        uses: apple-actions/import-codesign-certs@v2
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Install provisioning profile
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.yourcompany.orgNIZWE
          issuer-id: ${{ secrets.APPLE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPLE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPLE_API_PRIVATE_KEY }}

      - name: Update version
        run: |
          sed -i '' 's/MARKETING_VERSION = 1.0/MARKETING_VERSION = ${{ github.event.inputs.version }}/g' orgNIZWE.xcodeproj/project.pbxproj

      - name: Archive app
        run: |
          xcodebuild \
            -project orgNIZWE.xcodeproj \
            -scheme orgNIZWE \
            -destination 'generic/platform=iOS' \
            -archivePath build/orgNIZWE.xcarchive \
            archive

      - name: Export IPA
        run: |
          xcodebuild \
            -exportArchive \
            -archivePath build/orgNIZWE.xcarchive \
            -exportPath build \
            -exportOptionsPlist ExportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: orgNIZWE-${{ github.event.inputs.version }}.ipa
          path: build/orgNIZWE.ipa
