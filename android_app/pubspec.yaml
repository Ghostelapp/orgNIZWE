name: orgnizwe
version: 1.0.0+1
publish_to: 'none'

description: Life Organizer - osobiste centrum zarządzania życiem

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  intl: ^0.19.0
  table_calendar: ^3.0.9
  fl_chart: ^0.66.0
  http: ^1.2.0
  flutter_local_notifications: ^16.3.2
  timezone: ^0.9.2
  uuid: ^4.3.3
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  image_picker: ^1.0.7
  url_launcher: ^6.2.5
  share_plus: ^7.2.2

flutter:
  uses-material-design: true
  assets:
    - assets/
