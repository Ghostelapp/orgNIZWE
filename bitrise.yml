# Konfiguracja Bitrise dla orgNIZWE
# Wymaga konta Bitrise (darmowy plan dostępny)
# oraz App Store Connect API Key dodanej w ustawieniach Bitrise.
#
# Zmienne środowiskowe, które musisz dodać w Bitrise:
#   APPLE_API_ISSUER_ID     -> Issuer ID z App Store Connect
#   APPLE_API_KEY_ID        -> Key ID klucza API
#   APPLE_API_KEY           -> Cała zawartość pliku .p8
#
# Opcjonalnie:
#   APP_STORE_APP_ID        -> Apple ID aplikacji (np. 6809706779)

format_version: "13"
default_step_lib_source: https://github.com/bitrise-io/bitrise-steplib.git

project_type: ios

app:
  envs:
    - BITRISE_PROJECT_PATH: orgNIZWE.xcodeproj
    - BITRISE_SCHEME: orgNIZWE
    - BITRISE_BUNDLE_ID: com.organizer.aiorganizer
    - BITRISE_DISTRIBUTION_METHOD: app-store

workflows:
  primary:
    steps:
      - activate-ssh-key@4:
          run_if: '{{getenv "SSH_RSA_PRIVATE_KEY" | ne ""}}'
      - git-clone@8: {}
      - script@1:
          title: Show environment info
          inputs:
            - content: |
                #!/bin/bash
                set -ex
                xcodebuild -version
                echo "Bundle ID: $BITRISE_BUNDLE_ID"

      - script@1:
          title: Update version and build number
          inputs:
            - content: |
                #!/bin/bash
                set -ex
                VERSION=${BITRISE_GIT_TAG:-1.0.0}
                BUILD_NUMBER=${BITRISE_BUILD_NUMBER:-1}
                echo "Setting version: $VERSION, build: $BUILD_NUMBER"
                sed -i '' 's/MARKETING_VERSION = 1.0/MARKETING_VERSION = '"$VERSION"'/g' orgNIZWE.xcodeproj/project.pbxproj
                sed -i '' 's/CURRENT_PROJECT_VERSION = 1/CURRENT_PROJECT_VERSION = '"$BUILD_NUMBER"'/g' orgNIZWE.xcodeproj/project.pbxproj

      - xcode-archive@5:
          inputs:
            - project_path: $BITRISE_PROJECT_PATH
            - scheme: $BITRISE_SCHEME
            - distribution_method: $BITRISE_DISTRIBUTION_METHOD
            - automatic_code_signing: api-key
            - register_test_devices: "yes"
            - min_profile_validity: "0"
            - team_id: "7RPT2WR98Q"
            - export_development_team: "7RPT2WR98Q"
            - verbose_log: "yes"

      - deploy-to-itunesconnect-application-loader@1:
          inputs:
            - api_key_path: $BITRISE_APP_STORE_CONNECT_API_KEY_URL
            - api_issuer: $APPLE_API_ISSUER_ID
            - api_key_id: $APPLE_API_KEY_ID
            - api_key: $APPLE_API_KEY
            - ipa_path: $BITRISE_IPA_PATH

      - deploy-to-bitrise-io@2: {}
